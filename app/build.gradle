plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.omni.hub'
    compileSdk 34

    defaultConfig {
        applicationId "com.omni.hub"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        resConfigs "en", "xxhdpi"
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/*.version',
                '/META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    
    // ViewTree Lifecycle Owners for Dynamic Views
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // Networking & Concurrency
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Unit Testing
    testImplementation 'junit:junit:4.13.2'
}

// HARVEST TASK: Stocks the Armory with JAR dependencies for dynamic plugin compilation
tasks.register('harvestDeps') {
    doLast {
        def outputDir = file("${buildDir}/harvested_libs")
        outputDir.mkdirs()

        configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def file = artifact.file
            if (file.name.endsWith('.aar')) {
                copy {
                    from zipTree(file)
                    into outputDir
                    include "classes.jar"
                    rename "classes.jar", "${artifact.name}-${artifact.moduleVersion.id.version}.jar"
                }
            } else if (file.name.endsWith('.jar')) {
                copy {
                    from file
                    into outputDir
                }
            }
        }
        println "📦 Omni Hub Armory Stocked: Dependencies harvested to $outputDir"
    }
}