name: Forge and Ship Dynamic Plugin

on:
  workflow_dispatch:
    inputs:
      plugin_id:
        description: 'Unique Module ID (e.g. sample_utility)'
        required: true
        default: 'sample_utility'
      plugin_label:
        description: 'Display name in Omni Hub Store'
        required: true
        default: 'Sample Utility'
      plugin_version:
        description: 'Semantic Version'
        required: true
        default: '1.0.0'
      entry_class:
        description: 'Fully Qualified Entry Class Name'
        required: true
        default: 'com.omni.plugin.SampleUtility'
      description:
        description: 'Module Description'
        required: false
        default: 'Dynamic Jetpack Compose Utility Module'
      file_name:
        description: 'Output ZIP filename in Supabase Bucket'
        required: true
        default: 'sample_utility.zip'
      skip_res:
        description: 'Skip packaging dynamic resources'
        required: false
        default: 'false'

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    env:
      PLUGIN_ID: ${{ github.event.inputs.plugin_id }}
      PLUGIN_LABEL: ${{ github.event.inputs.plugin_label }}
      PLUGIN_VER: ${{ github.event.inputs.plugin_version }}
      ENTRY_CLASS: ${{ github.event.inputs.entry_class }}
      PLUGIN_DESC: ${{ github.event.inputs.description }}
      TARGET_FILENAME: ${{ github.event.inputs.file_name }}
      SKIP_RESOURCES: ${{ github.event.inputs.skip_res }}
      SUPABASE_URL: https://vlzgfaqrnyiqfxxxvtas.supabase.co
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsemdmYXFybnlpcWZ4eHh2dGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NTk5NDAsImV4cCI6MjA4MTEzNTk0MH0.y93d68JWyGL7NKXZEHLunAuayMEWw1K6yATFGLxkUxY
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Armory Dependency Cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: app/build/harvested_libs
          key: omni-armory-${{ hashFiles('app/build.gradle') }}

      - name: Harvest Dependencies (If Cache Miss)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: gradle app:harvestDeps

      - name: Compile and Forge Dynamic DEX
        run: |
          chmod +x forge.sh
          ./forge.sh

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_FILENAME }}
          path: bundle.zip

      - name: Ship Bundle to Supabase Storage & Catalog
        run: |
          echo "🚀 Uploading bundle.zip to Supabase Storage bucket 'omni-modules'..."
          STORAGE_STATUS=$(curl -s -o response_storage.txt -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/omni-modules/$TARGET_FILENAME" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/zip" \
            -H "x-upsert: true" \
            --data-binary @bundle.zip)

          if [ "$STORAGE_STATUS" -ge 200 ] && [ "$STORAGE_STATUS" -lt 300 ]; then
            echo "✅ Storage upload complete (HTTP $STORAGE_STATUS)."
          else
            echo "❌ Storage upload FAILED (HTTP $STORAGE_STATUS)."
            cat response_storage.txt
            exit 1
          fi

          DOWNLOAD_URL="$SUPABASE_URL/storage/v1/object/public/omni-modules/$TARGET_FILENAME"
          echo "🌐 Public CDN URL: $DOWNLOAD_URL"

          echo "📝 Registering module in 'omni_modules' database catalog..."
          DB_STATUS=$(curl -s -o response_db.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/omni_modules?on_conflict=id" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"id\": \"$PLUGIN_ID\",
              \"name\": \"$PLUGIN_LABEL\",
              \"description\": \"$PLUGIN_DESC\",
              \"version\": \"$PLUGIN_VER\",
              \"entry_class\": \"$ENTRY_CLASS\",
              \"file_name\": \"$TARGET_FILENAME\",
              \"download_url\": \"$DOWNLOAD_URL\"
            }")

          if [ "$DB_STATUS" -ge 200 ] && [ "$DB_STATUS" -lt 300 ]; then
            echo "✅ Omni Hub Cloud Catalog Updated (HTTP $DB_STATUS)."
          else
            echo "❌ Database catalog update FAILED (HTTP $DB_STATUS)."
            cat response_db.txt
            exit 1
          fi