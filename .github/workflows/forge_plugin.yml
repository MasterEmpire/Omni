name: Forge and Ship Dynamic Plugin

on:
  workflow_dispatch:
    inputs:
      app_label:
        description: 'Module or Folder Name (Conduit IDE)'
        required: true
        default: 'sample_utility'
      file_name:
        description: 'Storage ZIP filename (e.g. sample_utility.zip)'
        required: true
        default: 'sample_utility.zip'
      skip_res:
        description: 'Ignore dynamic resources'
        required: false
        default: 'false'
  repository_dispatch:
    types: [conduit_forge_trigger, forge_plugin]

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    env:
      APP_LABEL: ${{ github.event.inputs.app_label || github.event.client_payload.app_label || 'sample_utility' }}
      TARGET_FILENAME: ${{ github.event.inputs.file_name || github.event.client_payload.file_name || 'sample_utility.zip' }}
      SKIP_RESOURCES: ${{ github.event.inputs.skip_res || github.event.client_payload.skip_res || 'false' }}
      SUPABASE_URL: https://vlzgfaqrnyiqfxxxvtas.supabase.co
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsemdmYXFybnlpcWZ4eHh2dGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NTk5NDAsImV4cCI6MjA4MTEzNTk0MH0.y93d68JWyGL7NKXZEHLunAuayMEWw1K6yATFGLxkUxY
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Armory Dependency Cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: app/build/harvested_libs
          key: omni-armory-${{ hashFiles('app/build.gradle') }}

      - name: Harvest Dependencies (If Cache Miss)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: gradle app:harvestDeps

      - name: Execute Ship Script
        run: |
          chmod +x ship.sh
          ./ship.sh "$APP_LABEL" "$TARGET_FILENAME" "$SKIP_RESOURCES"

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_FILENAME }}
          path: bundle.zip