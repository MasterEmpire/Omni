name: Build Omni Hub Release APK

on: 
  workflow_dispatch:
  repository_dispatch:
    types: [conduit_build_trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log Build Context
        if: github.event.client_payload
        run: echo "Build triggered for version ${{ github.event.client_payload.version }}"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.event.client_payload.branch || github.ref }}
          fetch-depth: 0

      - name: Audit Source Code & Commit Fingerprint
        run: |
          echo "=========================================================="
          echo "🔍 [CI AUDIT] CHECKED-OUT COMMIT & REPOSITORY STATE"
          echo "=========================================================="
          echo "📌 Checked-out SHA : $(git rev-parse HEAD)"
          echo "🌿 Current Branch  : $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'detached HEAD')"
          echo "👤 Last Committer  : $(git log -1 --pretty=format:'%an <%ae> on %cd')"
          echo "💬 Last Commit Msg : $(git log -1 --pretty=format:'%s')"
          echo "=========================================================="
          echo "📜 RECENT 3 COMMITS:"
          git log -3 --oneline
          echo "=========================================================="
          echo "🔍 [CI AUDIT] Inspecting app/build.gradle version:"
          grep -E "versionCode|versionName" app/build.gradle
          echo "=========================================================="
          echo "🔍 [CI AUDIT] Inspecting MainActivity.kt for appVersion badge:"
          grep -n "appVersion" app/src/main/java/com/omni/hub/MainActivity.kt || echo "❌ appVersion NOT FOUND in checked-out MainActivity.kt!"
          echo "=========================================================="
          echo "🔍 [CI AUDIT] Inspecting AccessibilityDispatcher.kt for @JvmOverloads:"
          grep -n "isServiceActive" app/src/main/java/com/omni/hub/api/AccessibilityDispatcher.kt || echo "❌ isServiceActive NOT FOUND in checked-out code!"
          echo "=========================================================="
          echo "🔍 [CI AUDIT] Inspecting PluginManager.kt for focus_shield immunity:"
          grep -n "focus_shield" app/src/main/java/com/omni/hub/loader/PluginManager.kt || echo "❌ focus_shield NOT FOUND in PluginManager.kt!"
          echo "=========================================================="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK
        run: |
          # 1. Decode Keystore
          echo "${{ secrets.SIGNING_KEY }}" | base64 -di > app/release.jks
          
          # 2. Locate SDK Tools
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/34.* | head -1)
          
          # 3. Zipalign
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*release-unsigned.apk" -o -name "*release.apk" | head -1)
          $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED_APK" app/build/outputs/apk/release/omni-hub-aligned.apk

          # 4. Sign
          $BUILD_TOOLS_DIR/apksigner sign --ks app/release.jks \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/omni-hub-release.apk \
            app/build/outputs/apk/release/omni-hub-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-hub-release
          path: app/build/outputs/apk/release/omni-hub-release.apk