name: Forge Shared Runtime Pack

on:
  workflow_dispatch:

jobs:
  forge-runtime:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://vlzgfaqrnyiqfxxxvtas.supabase.co
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsemdmYXFybnlpcWZ4eHh2dGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NTk5NDAsImV4cCI6MjA4MTEzNTk0MH0.y93d68JWyGL7NKXZEHLunAuayMEWw1K6yATFGLxkUxY
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download & Extract Extended Icons Bytecode
        run: |
          mkdir -p runtime_build
          gradle -q --no-daemon -b - << 'EOF'
          repositories {
              google()
              mavenCentral()
          }
          configurations {
              runtimePack
          }
          dependencies {
              runtimePack "androidx.compose.material:material-icons-extended:1.6.8"
          }
          tasks.register("downloadPack") {
              doLast {
                  def outDir = file("runtime_build")
                  configurations.runtimePack.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                      def file = artifact.file
                      if (file.name.endsWith('.aar')) {
                          copy {
                              from zipTree(file)
                              into outDir
                              include "classes.jar"
                              rename "classes.jar", "icons.jar"
                          }
                      } else if (file.name.endsWith('.jar')) {
                          copy {
                              from file
                              into outDir
                              rename { "icons.jar" }
                          }
                      }
                  }
              }
          }
          EOF
          gradle downloadPack

      - name: Compile to Android DEX (classes.dex -> extended_icons.dex)
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT}/build-tools/34.* | head -1)

          echo "⚙️ Compiling icons.jar to DEX via d8..."
          $BUILD_TOOLS_DIR/d8 \
              --output "runtime_build/" \
              --lib "${ANDROID_SDK_ROOT}/platforms/android-34/android.jar" \
              runtime_build/icons.jar

          mv runtime_build/classes.dex extended_icons.dex
          echo "📦 Forged extended_icons.dex ($(wc -c < extended_icons.dex) bytes)"

      - name: Ship Runtime Pack to Supabase Storage
        run: |
          echo "🚀 Uploading extended_icons.dex to Supabase Storage bucket 'omni-modules'..."
          UPLOAD_STATUS=$(curl -s -o response_runtime.txt -w "%{http_code}" -X POST "$SUPABASE_URL/storage/v1/object/omni-modules/extended_icons.dex" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @extended_icons.dex)

          if [ "$UPLOAD_STATUS" -ge 200 ] && [ "$UPLOAD_STATUS" -lt 300 ]; then
            echo "✅ Shared runtime pack successfully forged and uploaded (HTTP $UPLOAD_STATUS)!"
          else
            echo "❌ Runtime upload FAILED (HTTP $UPLOAD_STATUS)."
            cat response_runtime.txt
            exit 1
          fi